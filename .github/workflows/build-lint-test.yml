name: PHP Build, Lint, Test

on:
    push:

jobs:
    build-test-lint:
        runs-on: ubuntu-latest

        steps:
            # Check out the commit under test. Pinning this to
            # XeroAPI/xero-php-oauth2 built the upstream default branch on
            # every run, so no change in this repository was ever exercised.
            - name: Checkout xero-php repo
              uses: actions/checkout@v4

            - name: Setup PHP
              run: sudo apt-get install -y php php-mbstring php-intl php-xml php-zip php-curl

            - name: Install Composer
              run: |
                php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
                php composer-setup.php --install-dir=/usr/local/bin --filename=composer
                php -r "unlink('composer-setup.php');"

            - name: Install Dependencies
              run: composer install

            - name: Validate PHP Syntax
              run: find . -path ./vendor -prune -o -name "*.php" -exec php -l {} \; > /dev/null || exit 1

            - name: Run Tests
              run: vendor/bin/phpunit